services:
  server:
    build: ./server
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: "file:/data/dev.db"
      JWT_SECRET: "change-me-in-production"
      SEED_ADMIN_EMAIL: "admin@wololocrm.local"
      SEED_ADMIN_PASSWORD: "admin1234"
    volumes:
      - ./data:/data
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: "http://localhost:4000/api"
    depends_on:
      - server
    restart: unless-stopped

  sqlite-web:
    image: coleifer/sqlite-web
    command: sqlite_web -H 0.0.0.0 -x /data/dev.db
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    depends_on:
      - server
    restart: unless-stopped
